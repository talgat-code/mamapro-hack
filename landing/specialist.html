<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Анкета специалиста — I-Help</title>
  <meta name="description" content="Полная анкета специалиста в каталоге I-Help. Демо: профили вымышлены.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="app/app.css">
  <script src="app/env.js"></script>
  <style>
    .site-top { display: flex; align-items: center; gap: 10px; padding: 14px 20px; max-width: 760px; margin: 0 auto; }
    .site-top a.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .site-wrap { max-width: 760px; margin: 0 auto; padding: 4px 20px 48px; }
    .site-grid { display: grid; gap: 16px; }
    @media (min-width: 720px) { .site-grid { grid-template-columns: 300px 1fr; align-items: start; } .prof { position: sticky; top: 16px; } }
    .site-foot { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 20px 40px; }
    .site-cta { margin-top: 16px; }
  </style>
</head>
<body>
  <header class="site-top">
    <a class="brand" href="./"><img class="top__mascot" src="app/mascot.png" alt=""><span class="top__brand">I-Help</span></a>
    <span class="top__spacer"></span>
    <div class="lang-pill" id="lang">
      <button data-lang="kk" aria-pressed="false">ҚАЗ</button><button data-lang="ru" aria-pressed="true">РУС</button>
    </div>
  </header>
  <main class="site-wrap" id="page"><div class="splash" style="min-height:50vh"><div class="spinner"></div></div></main>
  <footer class="site-foot" id="foot"></footer>

  <script>
  (function () {
    "use strict";
    var ENV = window.IHELP_ENV || {};
    var params = new URLSearchParams(location.search);
    var id = (params.get("id") || "").slice(0, 20);
    var lang = params.get("lang") === "kk" ? "kk" : "ru";
    var data = null;
    var AV = ["#FF870D", "#740112", "#E85D75", "#B35400", "#8A5A44", "#C2410C"];

    function esc(v) { return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function T(key, vars) {
      var d = data.catalog.TEXT[lang], s = d[key] != null ? d[key] : data.catalog.TEXT.ru[key];
      if (vars) s = s.replace(/\{(\w+)\}/g, function (m, k) { return k in vars ? vars[k] : m; });
      return String(s).replace(/<[^>]+>/g, "").replace(/\n+/g, " ");
    }
    function L(o) { return o ? (o[lang] || o.ru) : ""; }
    function money(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₸"; }

    function render() {
      document.documentElement.lang = lang;
      Array.prototype.forEach.call(document.querySelectorAll("#lang button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
      var page = document.getElementById("page");
      var foot = document.getElementById("foot");
      if (!data || data.notFound) {
        page.innerHTML = '<div class="text-card" style="margin-top:20px">Специалист не найден. / Маман табылмады.</div>';
        return;
      }
      var c = data.catalog, pr = data.profile;
      var k = pr.dir.split(":").map(Number), dir = L(c.SECTIONS[k[0]].dirs[k[1]]), section = L(c.SECTIONS[k[0]]);
      var city = pr.city ? L(c.CITIES.filter(function (x) { return x.id === pr.city; })[0]) : null;
      var price = pr.price == null ? T("priceUnknown") : (pr.price === 0 ? T("free") : money(pr.price));
      if (pr.price != null && pr.minutes) price = T("priceFmt", { price: price, min: pr.minutes });
      var fm = pr.formats.map(function (f) { return T(f === "off" ? "fmtOff" : "fmtOn"); }).join(", ");
      var lg = pr.langs.map(function (l) { return T(l === "kk" ? "langKk" : "langRu"); }).join(", ");
      var ages = pr.ages.map(function (a) { return L(c.AGES[a]); }).join(", ");
      var n = 0; for (var i = 0; i < pr.id.length; i++) n = (n * 31 + pr.id.charCodeAt(i)) % 997;
      var ini = pr.name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
      var exp = "";
      if (pr.exp) {
        var w = lang === "kk" ? "" : (pr.exp % 10 === 1 && pr.exp % 100 !== 11 ? " год" : pr.exp % 10 >= 2 && pr.exp % 10 <= 4 && (pr.exp % 100 < 12 || pr.exp % 100 > 14) ? " года" : " лет");
        exp = T("lExp", { n: pr.exp + w });
      }
      var rows = [[T("lDir"), section + " · " + dir]];
      if (city) rows.push([T("lCity"), city]);
      rows.push([T("lFormat"), fm], [T("lLangs"), lg], [T("lAges"), ages], [T("lPrice"), price]);
      var quals = (pr.quals || []).map(function (q) { return "<li>" + esc(q.title ? L(q.title) : "") + "</li>"; }).join("");
      document.title = pr.name + " — " + dir + " · I-Help";
      page.innerHTML =
        "<h1 style='margin:6px 0 16px'>" + esc(T("appSpecialistTitle")) + "</h1>" +
        '<div class="site-grid"><div class="prof"><div class="avatar" style="--av:' + AV[n % AV.length] + '">' + esc(ini) + '</div>' +
        '<div class="prof__name">' + esc(pr.name) + '</div><div class="prof__dir">' + esc(dir) + '</div>' +
        '<span class="badge badge--' + esc(pr.availability) + '">' + esc(T("appAvail_" + pr.availability)) + "</span>" +
        '<div class="site-cta"><a class="btn" href="' + esc(ENV.BOT_URL || "#") + '">' + esc(T("appBackToBot")) + "</a></div></div>" +
        "<div>" +
        '<div class="rows">' + rows.map(function (r) { return '<div class="row"><span class="row__k">' + esc(r[0]) + '</span><span class="row__v">' + esc(r[1]) + "</span></div>"; }).join("") + "</div>" +
        (pr.about ? "<h2>" + esc(T("appAbout")) + '</h2><div class="text-card">' + esc(L(pr.about)) + "</div>" : "") +
        (exp || quals ? '<div class="text-card" style="margin-top:12px">' + (exp ? "<b>" + esc(exp) + "</b>" : "") +
          (quals ? '<p class="note" style="margin-top:8px">' + esc(T("lQual")) + ':</p><ul class="quals">' + quals + "</ul>" : "") + "</div>" : "") +
        '<p class="note"><span class="demo">' + esc(T("demoMark")) + "</span></p></div></div>";
      foot.textContent = T("appDemo");
    }

    document.getElementById("lang").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-lang]");
      if (!b) return;
      lang = b.getAttribute("data-lang");
      params.set("lang", lang);
      history.replaceState(null, "", "?" + params.toString());
      render();
    });

    var api = ENV.API;
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && params.get("api")) api = params.get("api");
    fetch(api + "?action=specialist&id=" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (j) { data = j; render(); })
      .catch(function () { data = { notFound: true }; render(); });
  })();
  </script>
</body>
</html>
